# Code of Conduct. Machine-enforceable form.
#
# This file is the source of truth. Clause text is written by the clause owner
# (HR, Legal, Security), not by engineering. Every rule must carry at least one
# allow test and one deny test or CI fails (see tests/test_coc.py).

version: 1

defaults:
  window: 24h
  entity_kind: person

packs:
  - id: code-of-conduct
    name: Code of conduct
    description: Stops assistants from combining records into things your handbook forbids, like a layoff list or a pay ranking.
    example: "Budget + personnel + rota, refused before it forms."
    watches: [hr-personnel, finance-comp, ops-rota]
    enabled: true
  - id: financial-info-barrier
    name: Financial info-barriers
    description: Keeps the research and trading sides apart, so material non-public information cannot cross the wall through an assistant.
    example: "Trading desk asks for advisory docs, blocked. (SEC 15(g), FINRA 2241)"
    watches: [deal-advisory]
    enabled: true
  - id: hipaa
    name: HIPAA minimum-necessary
    description: Keeps individual health records away from assistants that should not see them, and masks identifiers in results.
    example: "Whole-record pull, refused; identifiers masked."
    watches: [health-records]
    enabled: true
  - id: secrets-dlp
    name: Secrets and IP
    description: Keeps secret stores and source code away from assistants, and masks keys and tokens in results.
    example: "Assistant reaches the secret store, refused."
    watches: [secrets-store]
    enabled: true
  - id: prompt-injection
    name: Prompt-injection shield
    description: Breaks the toxic flow. Once an assistant reads untrusted content, it cannot then send data out through another tool.
    example: "Poisoned issue, private-repo leak stopped."
    watches: [public-issues, private-repos]
    enabled: true
  - id: legal-hold
    name: Legal hold and privilege
    description: Keeps documents under legal hold or attorney-client privilege out of assistant answers.
    example: "Summarise the hold folder, refused."
    watches: [legal-hold, privileged, investigation-case-42]
    enabled: true
  - id: export-control
    name: Export control
    description: Blocks controlled technical data from reaching a person who is not cleared to receive it.
    example: "Uncleared account requests a controlled file, refused. (22 CFR 120.50)"
    watches: [export-controlled]
    enabled: false
  - id: data-residency
    name: Data residency
    description: Stops EU personal data from being served to a requester outside the region.
    example: "Out-of-region caller pulls EU HR data, blocked. (GDPR Ch. V)"
    watches: [eu-personal-data]
    enabled: false

rules:
  - rule_id: COC-HR-004
    pack: code-of-conduct
    title: Combining personnel, budget and rotation records
    clause: >
      Personnel records, compensation or budget records, and operational
      rosters may not be combined to derive the employment status,
      performance, or planned departure of identifiable individuals.
    owner: hr-privacy@example.com
    severity: high
    remediation: >
      If this is sanctioned workforce planning, request a purpose-bound
      session from HR Privacy. It is granted for four hours and every
      retrieval made under it is logged against the stated purpose.
    enforce:
      - layer: accumulation
        action: deny
        type: domain_join
        domains: [hr-personnel, finance-comp, ops-rota]
        require_entity_overlap: true
        scope: user
        window: 4h
    tests:
      - name: four_prompt_layoff_list
        expect: deny
        sequence:
          - {domain: finance-planning, entities: []}
          - {domain: finance-comp, entities: [p:alice, p:bob, p:carol]}
          - {domain: hr-personnel, entities: [p:alice, p:bob, p:carol, p:dan]}
          - {domain: ops-rota, entities: [p:alice, p:dan]}
      - name: two_domains_only_is_fine
        expect: allow
        sequence:
          - {domain: finance-comp, entities: [p:alice, p:bob]}
          - {domain: ops-rota, entities: [p:alice, p:bob]}
      - name: three_domains_no_shared_people
        expect: allow
        sequence:
          - {domain: finance-comp, entities: [p:alice]}
          - {domain: hr-personnel, entities: [p:erin]}
          - {domain: ops-rota, entities: [p:frank]}

  - rule_id: COC-HR-011
    pack: code-of-conduct
    title: Bulk lists of people
    clause: >
      Assistants may not be used to assemble rosters or lists of individuals
      from personnel systems beyond what a single task requires.
    owner: hr-privacy@example.com
    severity: medium
    remediation: >
      Bulk personnel extracts go through People Analytics, who can scope the
      export to the question being asked.
    enforce:
      - layer: accumulation
        action: alert          # alert first; flip to deny once tuned
        type: entity_budget
        domain: hr-personnel
        max_distinct: 8
        scope: user
        window: 24h
    tests:
      - name: small_lookup_is_fine
        expect: allow
        sequence:
          - {domain: hr-personnel, entities: [p:alice, p:bob]}
      - name: roster_reconstruction_alerts
        expect: alert
        sequence:
          - {domain: hr-personnel, entities: [p:a, p:b, p:c, p:d, p:e, p:f, p:g, p:h, p:i]}

  - rule_id: COC-LEGAL-001
    pack: legal-hold
    title: Legal hold material
    clause: >
      Content under legal hold is not available to assistants under any
      circumstances, including to users who can otherwise open it.
    owner: legal-ops@example.com
    severity: critical
    remediation: Contact Legal Ops. This restriction is not waivable in-product.
    enforce:
      - layer: retrieval
        action: deny
        type: domain_block
        domains: [legal-hold]
    tests:
      - name: legal_hold_blocked
        expect: deny
        sequence:
          - {domain: legal-hold, entities: []}
      - name: ordinary_domain_allowed
        expect: allow
        sequence:
          - {domain: ops-rota, entities: [p:alice]}

  - rule_id: COC-HR-021
    pack: code-of-conduct
    title: Comparing colleagues' timesheets
    clause: >
      Records of colleagues' working time, attendance or output may not be
      used to benchmark or compare individuals against one another, including
      against oneself, outside a sanctioned review.
    owner: hr-privacy@example.com
    severity: medium
    remediation: >
      Approving or reviewing your team's timesheets is fine and does not
      trigger this rule. If you need a comparison for a sanctioned review,
      ask HR Privacy for a purpose-bound session; it lasts four hours and
      every retrieval is logged against the stated purpose.
    enforce:
      - layer: accumulation
        action: deny
        type: self_comparison       # own record + colleagues' records, same domain
        domain: timesheets
        scope: user
        window: 24h
    tests:
      - name: manager_reviews_team_only
        expect: allow
        sequence:
          - {domain: timesheets, entities: [p:alice, p:bob, p:carol]}
      - name: own_timesheet_only
        expect: allow
        sequence:
          - {domain: timesheets, entities: [p:self]}
      - name: own_plus_colleagues_is_a_comparison
        expect: deny
        sequence:
          - {domain: timesheets, entities: [p:alice, p:bob]}
          - {domain: timesheets, entities: [p:self]}
      - name: colleagues_after_own_is_also_a_comparison
        expect: deny
        sequence:
          - {domain: timesheets, entities: [p:self]}
          - {domain: timesheets, entities: [p:alice]}

  # ---- Aggregate-only answers (EU Pay Transparency) ----
  - rule_id: COC-HR-031
    pack: code-of-conduct
    title: Pay figures for small groups
    clause: >
      Pay information may be shared with employees only as averages for
      categories of workers; figures that describe fewer than ten people are
      individual pay and may not be disclosed.
    owner: hr-privacy@example.com
    severity: high
    remediation: >
      Ask for a larger category (a whole job family or location). Individual
      pay questions go to your HR business partner.
    enforce:
      - layer: accumulation
        action: deny
        type: min_group
        domain: pay-aggregates
        k: 10
        scope: user
        window: 24h
    tests:
      - name: large_category_is_fine
        expect: allow
        sequence:
          - {domain: pay-aggregates, entities: [p:a, p:b, p:c, p:d, p:e, p:f, p:g, p:h, p:i, p:j, p:k]}
      - name: three_people_is_someone_s_salary
        expect: deny
        sequence:
          - {domain: pay-aggregates, entities: [p:a, p:b, p:c]}

  # ---- Protected-attribute firewall for AI-written reviews ----
  - rule_id: COC-HR-032
    pack: code-of-conduct
    title: Health and absence in performance reviews
    clause: >
      Performance assessments may not draw on health, absence, leave or
      accommodation records of the person being assessed.
    owner: hr-privacy@example.com
    severity: high
    remediation: >
      Write the review from performance and project records. If absence is
      genuinely relevant, HR adds it after review, not the assistant.
    enforce:
      - layer: accumulation
        action: deny
        type: domain_join
        domains: [performance-reviews, health-absence]
        require_entity_overlap: true
        scope: user
        window: 4h
    tests:
      - name: review_from_performance_only
        expect: allow
        sequence:
          - {domain: performance-reviews, entities: [p:dana]}
      - name: absence_pulled_into_the_same_review
        expect: deny
        sequence:
          - {domain: performance-reviews, entities: [p:dana]}
          - {domain: health-absence, entities: [p:dana]}

  # ---- Privilege containment ----
  - rule_id: COC-LEGAL-002
    pack: legal-hold
    title: Privileged legal material
    clause: >
      Privileged legal material is available only to the counsel of record
      for the matter and may not be summarised or reproduced into other
      channels.
    owner: legal-ops@example.com
    severity: critical
    remediation: Contact Legal Ops. Privilege is not waivable in-product.
    enforce:
      - layer: retrieval
        action: deny
        type: wall
        domains: [privileged]
        allowed_users: [counsel@example.com]
      - layer: accumulation
        action: deny
        type: domain_join
        domains: [privileged, chat]
        require_entity_overlap: false
        scope: user
        window: 4h
    tests:
      - name: counsel_may_read
        expect: allow
        user: counsel@example.com
        sequence:
          - {domain: privileged, entities: []}
      - name: others_may_not
        expect: deny
        sequence:
          - {domain: privileged, entities: []}
      - name: counsel_may_not_carry_it_into_chat
        expect: deny
        user: counsel@example.com
        sequence:
          - {domain: privileged, entities: []}
          - {domain: chat, entities: []}

  # ---- Embargo window ----
  - rule_id: COC-MGMT-001
    pack: code-of-conduct
    title: Restructuring plans before the announcement
    clause: >
      Restructuring plans are confidential until announced and may not be
      retrieved, inferred or discussed by anyone outside the planning team
      before the announcement date.
    owner: ceo-office@example.com
    severity: critical
    remediation: The announcement date is set by the CEO office; nothing is available earlier.
    enforce:
      - layer: retrieval
        action: deny
        type: wall
        domains: [restructuring-plan]
        allowed_users: [cfo@example.com, chro@example.com]
        until: 2099-01-01
    tests:
      - name: planning_team_may_read
        expect: allow
        user: cfo@example.com
        sequence:
          - {domain: restructuring-plan, entities: []}
      - name: everyone_else_waits
        expect: deny
        sequence:
          - {domain: restructuring-plan, entities: []}

  # ---- Investigation wall ----
  - rule_id: COC-LEGAL-003
    pack: legal-hold
    title: The subject of an investigation and the case file
    clause: >
      The subject of an internal investigation may not access the case file
      while the investigation is open.
    owner: legal-ops@example.com
    severity: critical
    remediation: Investigation records are shared with the subject by Legal at the appropriate stage.
    enforce:
      - layer: retrieval
        action: deny
        type: wall
        domains: [investigation-case-42]
        blocked_users: [subject42@example.com]
        until: 2099-01-01
    tests:
      - name: investigator_reads_the_case
        expect: allow
        sequence:
          - {domain: investigation-case-42, entities: []}
      - name: the_subject_cannot
        expect: deny
        user: subject42@example.com
        sequence:
          - {domain: investigation-case-42, entities: []}

  # ---- Consultation quiet period ----
  - rule_id: COC-MGMT-002
    pack: code-of-conduct
    title: Site finances and headcount during a consultation
    clause: >
      While a works-council consultation is open, site-level financial data
      may not be combined with headcount data by anyone outside the
      consultation team.
    owner: chro@example.com
    severity: high
    remediation: Site analyses during a consultation are prepared by the consultation team only.
    enforce:
      - layer: accumulation
        action: deny
        type: domain_join
        domains: [site-finance, headcount]
        require_entity_overlap: false
        allowed_users: [chro@example.com]
        until: 2099-01-01
        scope: user
        window: 24h
    tests:
      - name: consultation_team_may_model
        expect: allow
        user: chro@example.com
        sequence:
          - {domain: site-finance, entities: []}
          - {domain: headcount, entities: []}
      - name: a_manager_may_not
        expect: deny
        sequence:
          - {domain: site-finance, entities: []}
          - {domain: headcount, entities: []}

  # ---- A colleague's absence is health data ----
  - rule_id: COC-HR-033
    pack: code-of-conduct
    title: A colleague's absence and health records
    clause: >
      Absence, leave and sickness records of an identifiable individual are
      health information and may be retrieved only by HR. Coverage is planned
      from team rotas, not from a named person's absence record.
    owner: hr-privacy@example.com
    severity: high
    remediation: >
      To plan coverage, use the team rota. Absence for a named person is
      available to HR; if you manage the person and need it, ask HR.
    enforce:
      - layer: retrieval
        action: deny
        type: wall
        domains: [health-absence]
        allowed_users: [hr-privacy@example.com]
    tests:
      - name: hr_may_read_absence
        expect: allow
        user: hr-privacy@example.com
        sequence:
          - {domain: health-absence, entities: []}
      - name: a_colleague_may_not
        expect: deny
        sequence:
          - {domain: health-absence, entities: []}


  # ---- Protection pack: Financial info-barriers ----
  - rule_id: COC-FIN-001
    pack: financial-info-barrier
    title: Research and trading information barrier
    clause: >
      The advisory side and the trading side must stay separated. Material
      non-public information may not cross the wall through an assistant.
    owner: compliance@example.com
    severity: high
    remediation: >
      Deal-advisory material is available to the deal team only. Confirm your
      permitted side of the wall with Compliance.
    enforce:
      - layer: retrieval
        action: deny
        type: wall
        domains: [deal-advisory]
        allowed_users: [deal-team@example.com]
    tests:
      - {name: deal_team_may_read, expect: allow, user: deal-team@example.com, sequence: [{domain: deal-advisory, entities: []}]}
      - {name: trading_desk_may_not, expect: deny, user: trader@example.com, sequence: [{domain: deal-advisory, entities: []}]}

  # ---- Protection pack: HIPAA minimum-necessary ----
  - rule_id: COC-HIPAA-001
    pack: hipaa
    title: Individual health records are minimum-necessary
    clause: >
      Individual health records are available only to the care team. Assistants
      may not pull whole records for identifiable people.
    owner: privacy@example.com
    severity: high
    remediation: >
      Health records are limited to the care team. Ask Privacy if your task
      requires access.
    enforce:
      - layer: retrieval
        action: deny
        type: wall
        domains: [health-records]
        allowed_users: [care-team@example.com]
    tests:
      - {name: care_team_may_read, expect: allow, user: care-team@example.com, sequence: [{domain: health-records, entities: []}]}
      - {name: others_may_not, expect: deny, sequence: [{domain: health-records, entities: []}]}

  # ---- Protection pack: Secrets and IP ----
  - rule_id: COC-SEC-001
    pack: secrets-dlp
    title: Secret stores are off-limits to assistants
    clause: >
      Secret stores, credentials and key vaults are never available to
      assistants. Keys and tokens in results are masked.
    owner: security@example.com
    severity: high
    remediation: >
      The secret store is not reachable through assistants. Use your normal
      break-glass process for credentials.
    enforce:
      - layer: retrieval
        action: deny
        type: domain_block
        domains: [secrets-store]
    tests:
      - {name: normal_work_is_fine, expect: allow, sequence: [{domain: hr-personnel, entities: []}]}
      - {name: secret_store_is_blocked, expect: deny, sequence: [{domain: secrets-store, entities: []}]}

  # ---- Protection pack: Prompt-injection shield ----
  - rule_id: COC-SEC-002
    pack: prompt-injection
    title: No egress after reading untrusted content
    clause: >
      Once an assistant has read untrusted content in a session, it may not then
      reach a tool that can send data out. This breaks prompt-injection exfiltration.
    owner: security@example.com
    severity: high
    remediation: >
      Start a fresh session that has not read untrusted content, or ask Security
      to review the flow.
    enforce:
      - layer: retrieval
        action: deny
        type: flow
        taint_domains: [public-issues, untrusted-web]
        egress_domains: [private-repos, external-share]
    tests:
      - {name: egress_without_taint_is_fine, expect: allow, sequence: [{domain: private-repos, entities: []}]}
      - name: egress_after_untrusted_is_blocked
        expect: deny
        sequence:
          - {domain: public-issues, entities: []}
          - {domain: private-repos, entities: []}
      - name: any_write_after_untrusted_is_blocked
        expect: deny
        sequence:
          - {domain: public-issues, entities: []}
          - {domain: drive-general, write: true, entities: []}
      - {name: write_without_taint_is_fine, expect: allow, sequence: [{domain: drive-general, write: true, entities: []}]}

  # ---- Protection pack: Export control ----
  - rule_id: COC-EXP-001
    pack: export-control
    title: Export-controlled data to cleared persons only
    clause: >
      Controlled technical data may be released only to a person cleared to
      receive it. Serving it to an uncleared account is itself the violation.
    owner: trade-compliance@example.com
    severity: high
    remediation: >
      Export-controlled material is limited to cleared personnel. Confirm your
      clearance with Trade Compliance.
    enforce:
      - layer: retrieval
        action: deny
        type: wall
        domains: [export-controlled]
        allowed_users: [cleared@example.com]
    tests:
      - {name: cleared_person_may_read, expect: allow, user: cleared@example.com, sequence: [{domain: export-controlled, entities: []}]}
      - {name: uncleared_may_not, expect: deny, user: contractor@example.com, sequence: [{domain: export-controlled, entities: []}]}

  # ---- Protection pack: Data residency ----
  - rule_id: COC-RES-001
    pack: data-residency
    title: EU personal data stays in region
    clause: >
      EU personal data may be served only to requesters in the region, absent a
      documented transfer basis.
    owner: dpo@example.com
    severity: high
    remediation: >
      Out-of-region access to EU personal data needs a documented transfer basis.
      Contact the Data Protection Officer.
    enforce:
      - layer: retrieval
        action: deny
        type: wall
        domains: [eu-personal-data]
        allowed_users: [eu-user@example.com]
    tests:
      - {name: in_region_may_read, expect: allow, user: eu-user@example.com, sequence: [{domain: eu-personal-data, entities: []}]}
      - {name: out_of_region_may_not, expect: deny, user: us-user@example.com, sequence: [{domain: eu-personal-data, entities: []}]}

  # ---- Protection pack: Secrets and IP (write control) ----
  - rule_id: COC-SEC-003
    pack: secrets-dlp
    title: No writing to external shares
    clause: >
      Assistants may read from an external share but may not create or modify
      files there. Writing out is how data leaves.
    owner: security@example.com
    severity: high
    remediation: >
      Reads are allowed; writes to the external share are not. Ask Security if a
      write is genuinely needed.
    enforce:
      - layer: retrieval
        action: deny
        type: domain_block
        domains: [external-share]
        applies: write
    tests:
      - {name: reading_external_share_is_fine, expect: allow, sequence: [{domain: external-share, entities: []}]}
      - {name: writing_external_share_is_blocked, expect: deny, sequence: [{domain: external-share, write: true, entities: []}]}
